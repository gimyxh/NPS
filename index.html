<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3FBF">
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>مسار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap"></noscript>
<style>
/* Layout: one column phone app. Sticky top bar, source filter chips, a list of sheet cards;
   tapping a card opens its rows as a flat list; a floating button opens the upload panel. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#13201E; --muted:#5B6A67; --line:#D8DFDD;
  --accent:#1F3FBF; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --got:#12805C; --got-soft:#DDF1E9; --pend:#A86A0B; --pend-soft:#F8EBD3; --ret:#C2362B; --ret-soft:#F9E0DD;
  --font-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --font-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1514; --surface:#162120; --ink:#E6EEEC; --muted:#93A5A1; --line:#273735;
    --accent:#8FA6FF; --accent-ink:#0B1233; --accent-soft:#1D2750;
    --got:#4CC79A; --got-soft:#12332A; --pend:#E6B05A; --pend-soft:#3A2D12; --ret:#F08A80; --ret-soft:#3E1D1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#162120; --ink:#E6EEEC; --muted:#93A5A1; --line:#273735;
  --accent:#8FA6FF; --accent-ink:#0B1233; --accent-soft:#1D2750;
  --got:#4CC79A; --got-soft:#12332A; --pend:#E6B05A; --pend-soft:#3A2D12; --ret:#F08A80; --ret-soft:#3E1D1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin-inline:auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;flex:1;min-width:0;text-wrap:balance;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--ret);border-color:var(--ret)}
.btn.danger.armed{background:var(--ret);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.back{border:0;background:none;padding:6px 8px;margin-inline-start:-8px;font-size:22px;line-height:1;color:var(--accent)}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:14px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.sum b{display:block;font-size:20px;font-weight:600}
.sum span{font-size:12px;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}

.cards{display:grid;gap:10px;margin-top:12px}
@media(min-width:620px){.cards{grid-template-columns:1fr 1fr}}
.card{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-h h3{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700;overflow-wrap:anywhere}
.tag{font-size:12px;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 7px;white-space:nowrap}
.card-h .n{margin-inline-start:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-block:10px 8px}
.bar i{display:block;height:100%}
.bar .g{background:var(--got)}.bar .p{background:var(--pend)}.bar .r{background:var(--ret)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.legend .g::before,.legend .p::before,.legend .r::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:5px}
.legend .g::before{background:var(--got)}.legend .p::before{background:var(--pend)}.legend .r::before{background:var(--ret)}
.legend .m{margin-inline-start:auto}

.empty{text-align:center;padding:36px 8px;color:var(--muted)}
.empty h2{font-family:var(--font-display);color:var(--ink);font-size:20px;margin:0 0 6px}
.note{font-size:13px;color:var(--muted);margin-block:10px}

.dhead{padding-block:12px 4px}
.dhead h2{margin:0;font-family:var(--font-display);font-size:24px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-block:10px}

.rows{margin-top:6px;border-top:1px solid var(--line)}
.row{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;min-width:0}
.row-t{display:flex;gap:8px;align-items:center}
.row-t strong{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.row-t .sn{font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px;white-space:nowrap}
.pill.got{background:var(--got-soft);color:var(--got)}
.pill.pend{background:var(--pend-soft);color:var(--pend)}
.pill.ret{background:var(--ret-soft);color:var(--ret)}
.pill.other{background:var(--accent-soft);color:var(--accent)}
.row-m{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:2px}
.row-a{font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row-n{font-size:13px;color:var(--pend);margin-top:2px}
.more{display:block;margin:14px auto}

.fab{position:fixed;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.overlay .head{display:flex;align-items:center;gap:8px;padding-block:12px}
.overlay .head h2{margin:0;font-family:var(--font-display);font-size:21px;flex:1}
.field{display:grid;gap:6px;margin-block:14px}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.in{min-height:44px;resize:vertical}
.drop{display:block;border:1.5px dashed var(--accent);border-radius:12px;padding:20px 12px;text-align:center;background:var(--accent-soft);color:var(--accent);font-weight:600}
.drop input{display:none}
.plist{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.plist div{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.plist div:last-child{border-bottom:0}
.plist b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.plist small{color:var(--muted)}
.plist .dup{color:var(--pend);font-size:12px}
.radios{display:grid;gap:8px}
.radios label{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink)}
.stat-chips{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.warn{background:var(--pend-soft);color:var(--pend);border-radius:10px;padding:10px 12px;font-size:14px;margin-block:10px}
</style>


</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <div class="wrap">
    <header class="top">
      <button class="back" id="back" hidden aria-label="رجوع">›</button>
      <h1 id="ttl">مسار</h1>
      <button class="btn" id="btnAll" hidden>تنزيل الكل</button>
    </header>
    <main id="view"><p class="note">بحمّل...</p></main>
  </div>
  <button class="fab" id="fab" hidden>+ إضافة ملف</button>
  <div class="overlay" id="panel" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
const BRAND = "مسار";            // اسم البراند: غيّره من هنا
const TAGLINE = "إدارة الشحنات · عبدالرحمن"; // السطر الصغير تحت الاسم
document.documentElement.dir = "rtl"; document.documentElement.lang = "ar";
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CH = 80; // rows per stored chunk
const S = { db: null, dl: null, canWrite: true, groups: [], chunks: {}, cache: {}, ready: false, slow: false,
  src: "all", q: "", dq: "", dstat: "all", limit: 120, armed: "" };

/* ---------- Excel library (loaded only when needed) ---------- */
const XLSX_URLS = ["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
  "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js", "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"];
const loadScript = u => new Promise((res, rej) => { const s = document.createElement("script"); s.src = u; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.appendChild(s); });
let xlsxP = null;
function ensureXLSX() {
  if (window.XLSX && XLSX.read) return Promise.resolve();
  if (!xlsxP) xlsxP = (async () => {
    for (const u of XLSX_URLS) { try { await loadScript(u); if (window.XLSX) return; } catch (e) {} }
    throw new Error("XLSX_LOAD");
  })().catch(e => { xlsxP = null; throw e; });
  return xlsxP;
}
window.addEventListener("error", e => toast("حصل خطأ: " + (e.message || "")));

/* ---------- helpers ---------- */
const clean = v => String(v ?? "").replace(/ـ/g, "").replace(/\s+/g, " ").trim();
const norm = v => clean(v).replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
const money = n => Math.round(n).toLocaleString("en-US");
function statusKind(s) {
  const t = norm(s);
  if (!t) return "";
  if (t.includes("استلم")) return "got";
  if (t.includes("مرتجع")) return "ret";
  if (t.includes("مؤجل") || t.includes("تاجيل") || t.includes("لم يصل")) return "pend";
  return "other";
}
function cols(h) {
  const f = re => h.findIndex(x => re.test(norm(x)));
  return { name: f(/^الاسم/), phone: f(/^الرقم/), addr: f(/^العنوان/), co: f(/الشركه الراسله/), price: f(/^السعر$/),
    coll: f(/الستلم|المستلم/), status: f(/^الحاله/), notes: f(/^ملاحظات/), agent: f(/^المندوب/), sn: f(/^مسلسل/) };
}
function rowsOf(gid) {
  if (S.cache[gid]) return S.cache[gid];
  const c = S.chunks[gid] || {};
  const out = Object.keys(c).map(Number).sort((a, b) => a - b).flatMap(i => c[i]);
  return (S.cache[gid] = out);
}
function stats(g) {
  const rows = rowsOf(g.id), c = cols(g.headers), st = { got: 0, pend: 0, ret: 0, other: 0, coll: 0, n: rows.length };
  for (const r of rows) {
    const k = c.status >= 0 ? statusKind(r[c.status]) : "";
    if (k) st[k]++;
    if (k === "got" && c.coll >= 0) { const x = Number(r[c.coll]); if (isFinite(x)) st.coll += x; }
  }
  return st;
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
const newId = () => "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fileSafe = s => String(s).replace(/[\\/:*?"<>|]/g, " ").replace(/\s+/g, " ").trim();

/* ---------- storage ---------- */
async function writeRows(gid, rows, from = 0, oldChunks = 0) {
  const n = Math.ceil(rows.length / CH);
  for (let i = from; i < n; i++) await S.db.doc(`rows/${gid}_${i}`).set({ gid, i, rows: rows.slice(i * CH, (i + 1) * CH) });
  for (let i = n; i < oldChunks; i++) await S.db.doc(`rows/${gid}_${i}`).delete();
  return n;
}
async function saveGroup(g, rows) {
  const old = S.groups.find(x => x.id === g.id);
  const n = await writeRows(g.id, rows, 0, old ? old.chunks : 0);
  await S.db.doc(`groups/${g.id}`).set({ name: g.name, source: g.source, headers: g.headers, count: rows.length, chunks: n,
    ord: g.ord ?? Date.now(), file: g.file || "", updated: Date.now() });
}
async function removeGroup(g) {
  for (let i = 0; i < g.chunks; i++) await S.db.doc(`rows/${g.id}_${i}`).delete();
  await S.db.doc(`groups/${g.id}`).delete();
}

/* ---------- home ---------- */
function sources() { return [...new Set(S.groups.map(g => g.source))]; }
function renderHome() {
  const ss = sources();
  $("#view").innerHTML = `
    <p class="note" style="margin-block:12px 0">${esc(TAGLINE)}</p>
    <div class="summary" id="sum"></div>
    <div class="chips" id="srcChips"></div>
    <input class="search" id="q" type="search" placeholder="ابحث باسم القسم" value="${esc(S.q)}" autocomplete="off">
    <div id="list"></div>
    <div class="actions" style="margin-top:24px"><button class="btn" id="bkp">حفظ نسخة احتياطية</button><label class="btn" for="rst" style="display:inline-flex;align-items:center">استرجاع نسخة</label><input id="rst" type="file" accept=".json" hidden></div>
    <p class="note">البيانات محفوظة على الجهاز ده. خد نسخة احتياطية من وقت للتاني.</p>`;
  $("#bkp").onclick = backup; $("#rst").onchange = restore;
  $("#q").addEventListener("input", e => { S.q = e.target.value; updateHome(); });
  updateHome();
}
function updateHome() {
  const all = S.groups, shown = all.filter(g => (S.src === "all" || g.source === S.src) && (!S.q || norm(g.name).includes(norm(S.q))));
  let rows = 0, coll = 0;
  for (const g of all) { const s = stats(g); rows += s.n; coll += s.coll; }
  $("#sum").innerHTML = `<div class="sum"><b class="num">${all.length}</b><span>قسم</span></div>
    <div class="sum"><b class="num">${money(rows)}</b><span>صف</span></div>
    <div class="sum"><b class="num">${money(coll)}</b><span>تم تحصيله (ج)</span></div>`;
  const ss = sources();
  $("#srcChips").innerHTML = ss.length > 1 ? [["all", "الكل"], ...ss.map(s => [s, s])].map(([k, l]) =>
    `<button class="chip" data-src="${esc(k)}" aria-pressed="${S.src === k}">${esc(l)}</button>`).join("") : "";
  const L = $("#list");
  if (!S.ready) { L.innerHTML = `<div class="empty"><p>${S.slow ? "التخزين بطيء في الرد، لسه بنحاول..." : "بحمّل الأقسام..."}</p></div>`; return; }
  if (!all.length) {
    L.innerHTML = `<div class="empty"><h2>لسه مفيش أقسام</h2><p>اضغط "إضافة ملف"، اختار ملف الإكسل واكتب اسم المصدر (قنا أو الأقصر)، والنظام يقسم الصفوف حسب عمود المحافظه.</p></div>`; return;
  }
  if (!shown.length) { L.innerHTML = `<div class="empty"><p>مفيش قسم بالاسم ده.</p></div>`; return; }
  L.innerHTML = `<div class="cards">${shown.map(g => {
    const s = stats(g), t = Math.max(1, s.got + s.pend + s.ret + s.other);
    const w = k => (s[k] / t * 100).toFixed(1) + "%";
    return `<button class="card" data-g="${g.id}">
      <div class="card-h"><h3>${esc(g.name)}</h3><span class="tag">${esc(g.source)}</span><span class="n num">${s.n} صف</span></div>
      <div class="bar"><i class="g" style="width:${w("got")}"></i><i class="p" style="width:${w("pend")}"></i><i class="r" style="width:${w("ret")}"></i></div>
      <div class="legend num"><span class="g">استلم <b>${s.got}</b></span><span class="p">مؤجل <b>${s.pend}</b></span><span class="r">مرتجع <b>${s.ret}</b></span>
      ${s.coll ? `<span class="m">${money(s.coll)} ج</span>` : ""}</div></button>`;
  }).join("")}</div>`;
}

/* ---------- detail ---------- */
function curGroup() { const m = /^#sheet-(.+)$/.exec(location.hash); return m ? S.groups.find(g => g.id === m[1]) : null; }
function renderDetail(g) {
  $("#view").innerHTML = `
    <div class="dhead"><h2><span>${esc(g.name)}</span><span class="tag">${esc(g.source)}</span></h2></div>
    <div id="dsum"></div>
    <div class="actions">
      <button class="btn primary" id="dl">تنزيل Excel</button>
      ${S.canWrite ? `<button class="btn" id="addRow">+ صف جديد</button><button class="btn danger" id="delG">حذف القسم</button>` : ""}
    </div>
    <div class="chips" id="stChips"></div>
    <input class="search" id="dq" type="search" placeholder="ابحث بالاسم أو الرقم أو العنوان" value="${esc(S.dq)}" autocomplete="off">
    <div class="rows" id="rows"></div>`;
  $("#dq").addEventListener("input", e => { S.dq = e.target.value; S.limit = 120; updateDetail(g); });
  updateDetail(g);
}
function updateDetail(g) {
  const rows = rowsOf(g.id), c = cols(g.headers), st = stats(g);
  $("#dsum").innerHTML = `<div class="legend num"><span class="g">استلم <b>${st.got}</b></span><span class="p">مؤجل <b>${st.pend}</b></span><span class="r">مرتجع <b>${st.ret}</b></span>
    ${st.coll ? `<span class="m">محصّل ${money(st.coll)} ج</span>` : ""}</div>`;
  const chips = [["all", "الكل", st.n], ["got", "استلم", st.got], ["pend", "مؤجل", st.pend], ["ret", "مرتجع", st.ret]];
  $("#stChips").innerHTML = chips.map(([k, l, n]) => `<button class="chip num" data-st="${k}" aria-pressed="${S.dstat === k}">${l} ${n}</button>`).join("");
  const q = norm(S.dq);
  const list = [];
  rows.forEach((r, i) => {
    if (S.dstat !== "all" && !(c.status >= 0 && statusKind(r[c.status]) === S.dstat)) return;
    if (q && !norm(r.join(" ")).includes(q)) return;
    list.push(i);
  });
  const v = (r, k) => c[k] >= 0 ? clean(r[c[k]]) : "";
  const html = list.slice(0, S.limit).map(i => {
    const r = rows[i], s = v(r, "status"), k = statusKind(s);
    const title = v(r, "name") || v(r, "phone") || `صف ${i + 1}`;
    const price = v(r, "price"), coll = v(r, "coll");
    const meta = [v(r, "phone") && `<span class="num">${esc(v(r, "phone"))}</span>`, v(r, "co") && `<span>${esc(v(r, "co"))}</span>`,
      v(r, "agent") && `<span>مندوب: ${esc(v(r, "agent"))}</span>`, price && `<span class="num">${esc(price)} ج${coll && coll !== price ? ` ← ${esc(coll)}` : ""}</span>`].filter(Boolean).join("");
    return `<button class="row" data-i="${i}">
      <div class="row-t"><span class="sn num">${i + 1}</span><strong>${esc(title)}</strong>${s ? `<span class="pill ${k}">${esc(s)}</span>` : ""}</div>
      <div class="row-m">${meta}</div>
      ${v(r, "addr") ? `<div class="row-a">${esc(v(r, "addr"))}</div>` : ""}
      ${v(r, "notes") ? `<div class="row-n">${esc(v(r, "notes"))}</div>` : ""}</button>`;
  }).join("");
  $("#rows").innerHTML = (html || `<div class="empty"><p>مفيش صفوف مطابقة.</p></div>`) +
    (list.length > S.limit ? `<button class="btn more" id="more">عرض المزيد (${list.length - S.limit})</button>` : "");
}

/* ---------- row editor ---------- */
const STATUSES = ["استلم", "مرتجع", "مؤجل", "تاجيل", "لم يصل"];
function openEditor(g, idx) {
  const rows = rowsOf(g.id), isNew = idx < 0, r = isNew ? g.headers.map(() => "") : rows[idx], c = cols(g.headers);
  const P = $("#panel");
  P.hidden = false; P.scrollTop = 0;
  P.innerHTML = `<div class="wrap"><div class="head"><button class="back" data-close aria-label="إغلاق">›</button><h2>${isNew ? "صف جديد" : `صف ${idx + 1}`}</h2></div>
    ${g.headers.map((h, i) => {
      const long = i === c.addr || i === c.notes;
      const chips = i === c.status ? `<div class="stat-chips">${STATUSES.map(s => `<button type="button" class="chip" data-setst="${esc(s)}">${s}</button>`).join("")}</div>` : "";
      return `<div class="field"><label for="f${i}">${esc(h || "عمود " + (i + 1))}</label>${chips}
        ${long ? `<textarea class="in" id="f${i}" rows="3">${esc(r[i])}</textarea>` : `<input class="in" id="f${i}" value="${esc(r[i])}">`}</div>`;
    }).join("")}
    <div class="actions">${S.canWrite ? `<button class="btn primary" id="saveRow">حفظ</button>` : ""}
      ${S.canWrite && !isNew ? `<button class="btn danger" id="delRow">حذف الصف</button>` : ""}
      <button class="btn" data-close>إلغاء</button></div></div>`;
  P.onclick = async e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.hasAttribute("data-close")) { P.hidden = true; return; }
    if (t.dataset.setst != null) { $(`#f${c.status}`).value = t.dataset.setst; return; }
    if (t.id === "saveRow") {
      const nr = g.headers.map((_, i) => { const x = $(`#f${i}`).value.trim(); return x !== "" && /^-?\d+(\.\d+)?$/.test(x) && x.length < 12 && !/^0/.test(x) ? Number(x) : x; });
      t.disabled = true;
      try {
        const all = rows.slice(); let from;
        if (isNew) { all.push(nr); from = Math.floor((all.length - 1) / CH); } else { all[idx] = nr; from = Math.floor(idx / CH); }
        const n = await writeRows(g.id, all, from, g.chunks);
        await S.db.doc(`groups/${g.id}`).update({ count: all.length, chunks: n, updated: Date.now() });
        P.hidden = true; toast("اتحفظ");
      } catch (err) { t.disabled = false; toast("ما اتحفظش: " + (err.message || err.code)); }
    }
    if (t.id === "delRow") {
      if (S.armed !== "row") { S.armed = "row"; t.textContent = "اضغط تاني للتأكيد"; t.classList.add("armed"); return; }
      S.armed = ""; t.disabled = true;
      try {
        const all = rows.slice(); all.splice(idx, 1);
        const n = await writeRows(g.id, all, Math.floor(idx / CH), g.chunks);
        await S.db.doc(`groups/${g.id}`).update({ count: all.length, chunks: n, updated: Date.now() });
        P.hidden = true; toast("اتحذف الصف");
      } catch (err) { t.disabled = false; toast("ما اتحذفش: " + (err.message || err.code)); }
    }
  };
}

/* ---------- upload ---------- */
const U = { wb: null, name: "", sheet: "", aoa: [], hrow: 0, headers: [], gcol: 0, groups: [], skipped: 0, source: "", mode: "append", busy: false, err: "" };
function openUpload() {
  Object.assign(U, { wb: null, name: "", sheet: "", aoa: [], headers: [], groups: [], skipped: 0, source: "", mode: "append", busy: false, err: "" });
  const P = $("#panel"); P.hidden = false; P.scrollTop = 0;
  const known = sources(); const base = [...new Set(["قنا", "الأقصر", ...known])];
  P.innerHTML = `<div class="wrap"><div class="head"><button class="back" data-close aria-label="إغلاق">›</button><h2>إضافة ملف</h2></div>
    <label class="drop" for="file"><span id="dropTxt">اختار ملف Excel</span><input id="file" type="file" accept=".xlsx,.xls,.xlsm,.csv"></label>
    <div class="field"><label for="src">الملف ده جاي من فين؟ (بيتكتب جنب اسم كل قسم)</label>
      <div class="stat-chips">${base.map(s => `<button type="button" class="chip" data-setsrc="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <input class="in" id="src" placeholder="مثلاً: قنا" autocomplete="off"></div>
    <div id="upBody"></div></div>`;
  $("#src").addEventListener("input", e => { U.source = e.target.value.trim(); renderUpBody(); });
  $("#file").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    $("#dropTxt").textContent = f.name; U.name = f.name; U.err = "";
    try { await ensureXLSX(); U.wb = XLSX.read(await f.arrayBuffer(), { type: "array" }); U.sheet = U.wb.SheetNames[0]; analyze(); }
    catch (err) { U.wb = null; U.err = err && err.message === "XLSX_LOAD" ? "مكتبة الإكسل ما اتحمّلتش. اتأكد من النت وجرّب تاني." : "الملف ده مش بيتفتح. اتأكد إنه ملف Excel سليم."; }
    renderUpBody();
  });
  P.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.hasAttribute("data-close")) { P.hidden = true; return; }
    if (t.dataset.setsrc != null) { $("#src").value = t.dataset.setsrc; U.source = t.dataset.setsrc; renderUpBody(); return; }
    if (t.id === "doSave") doUpload();
  };
  P.onchange = e => {
    if (e.target.id === "sheetSel") { U.sheet = e.target.value; analyze(); renderUpBody(); }
    if (e.target.id === "colSel") { U.gcol = Number(e.target.value); regroup(); renderUpBody(); }
    if (e.target.name === "mode") { U.mode = e.target.value; }
  };
  renderUpBody();
}
function analyze() {
  const ws = U.wb.Sheets[U.sheet];
  U.aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
  let h = U.aoa.slice(0, 15).findIndex(r => r.some(x => /المحافظ/.test(norm(x))));
  if (h < 0) h = U.aoa.findIndex(r => r.filter(x => clean(x) !== "").length >= 3);
  U.hrow = Math.max(0, h);
  const hr = U.aoa[U.hrow] || [];
  let w = hr.length; while (w > 0 && clean(hr[w - 1]) === "") w--;
  U.headers = hr.slice(0, w).map((x, i) => clean(x) || "عمود " + (i + 1));
  const gi = U.headers.findIndex(x => /المحافظ/.test(norm(x)));
  U.gcol = gi >= 0 ? gi : 0;
  regroup();
}
function regroup() {
  const map = new Map(); let skipped = 0; const w = U.headers.length;
  const sn = cols(U.headers).sn;
  for (const raw of U.aoa.slice(U.hrow + 1)) {
    const r = Array.from({ length: w }, (_, i) => typeof raw[i] === "string" ? raw[i].trim() : (raw[i] ?? ""));
    const key = clean(r[U.gcol]);
    if (!key) { if (r.filter((x, i) => i !== sn && String(x) !== "").length >= 2) skipped++; continue; }
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(r);
  }
  U.groups = [...map].map(([name, rows]) => ({ name, rows })); U.skipped = skipped;
}
function renderUpBody() {
  const B = $("#upBody"); if (!B) return;
  if (U.err) { B.innerHTML = `<div class="warn">${esc(U.err)}</div>`; return; }
  if (!U.wb) { B.innerHTML = `<p class="note">بعد ما تختار الملف هتشوف الأقسام اللي هتتعمل قبل الحفظ.</p>`; return; }
  const total = U.groups.reduce((a, g) => a + g.rows.length, 0);
  const dups = U.groups.filter(g => S.groups.some(x => x.name === g.name && x.source === U.source));
  B.innerHTML = `
    ${U.wb.SheetNames.length > 1 ? `<div class="field"><label for="sheetSel">الشيت اللي هيتقرا</label><select class="in" id="sheetSel">${U.wb.SheetNames.map(n => `<option ${n === U.sheet ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>` : ""}
    <div class="field"><label for="colSel">العمود اللي بيتقسم عليه</label><select class="in" id="colSel">${U.headers.map((h, i) => `<option value="${i}" ${i === U.gcol ? "selected" : ""}>${esc(h)}</option>`).join("")}</select></div>
    ${U.groups.length ? `<div class="lbl">هيتعمل ${U.groups.length} قسم من ${total} صف</div>
    <div class="plist num">${U.groups.map(g => `<div><b>${esc(g.name)}${U.source ? ` - ${esc(U.source)}` : ""}</b>${S.groups.some(x => x.name === g.name && x.source === U.source) ? `<span class="dup">موجود</span>` : ""}<small>${g.rows.length} صف</small></div>`).join("")}</div>`
      : `<div class="warn">مفيش قيم في العمود ده. جرّب تختار عمود تاني.</div>`}
    ${U.skipped ? `<p class="note">${U.skipped} صف فيهم بيانات بس من غير قيمة في العمود ده، ومش هيتضافوا.</p>` : ""}
    ${dups.length ? `<div class="field"><span class="lbl">${dups.length} قسم موجود بنفس الاسم والمصدر</span><div class="radios">
      <label><input type="radio" name="mode" value="append" ${U.mode === "append" ? "checked" : ""}> ضيف الصفوف على القسم الموجود</label>
      <label><input type="radio" name="mode" value="replace" ${U.mode === "replace" ? "checked" : ""}> استبدل القسم الموجود بالجديد</label></div></div>` : ""}
    <div class="actions"><button class="btn primary" id="doSave" ${(!U.source || !U.groups.length || U.busy || !S.canWrite) ? "disabled" : ""}>${U.busy ? "بحفظ..." : "حفظ الأقسام"}</button></div>
    ${!U.source ? `<p class="note">اكتب مصدر الملف الأول (قنا أو الأقصر).</p>` : ""}`;
}
async function doUpload() {
  U.busy = true; renderUpBody();
  try {
    let ord = Date.now();
    for (const g of U.groups) {
      const ex = S.groups.find(x => x.name === g.name && x.source === U.source);
      const same = ex && JSON.stringify(ex.headers) === JSON.stringify(U.headers);
      if (ex && same && U.mode === "append") await saveGroup({ ...ex }, [...rowsOf(ex.id), ...g.rows]);
      else if (ex && same && U.mode === "replace") await saveGroup({ ...ex, file: U.name }, g.rows);
      else await saveGroup({ id: newId(), name: g.name, source: U.source, headers: U.headers, ord: ord++, file: U.name }, g.rows);
    }
    $("#panel").hidden = true; toast(`اتحفظ ${U.groups.length} قسم`); location.hash = "";
  } catch (err) { U.busy = false; renderUpBody(); toast("ما اتحفظش: " + (err.message || err.code || "خطأ")); }
}

/* ---------- export ---------- */
function sheetOf(g) {
  const ws = XLSX.utils.aoa_to_sheet([g.headers, ...rowsOf(g.id)]);
  ws["!cols"] = g.headers.map(() => ({ wch: 18 }));
  return ws;
}
async function saveWb(wb, filename) {
  wb.Workbook = { Views: [{ RTL: true }] };
  const data = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  try { await S.dl.save({ filename, data }); toast("اتنزل الملف"); }
  catch (e) { if (e && e.code !== "declined") toast("التنزيل مش متاح هنا"); }
}
async function exportOne(g) {
  try { await ensureXLSX(); } catch (e) { return toast("مكتبة الإكسل ما اتحمّلتش. جرّب تاني."); }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetOf(g), fileSafe(`${g.name} - ${g.source}`).slice(0, 31));
  return saveWb(wb, fileSafe(`${g.name} - ${g.source}`) + ".xlsx");
}
async function exportAll() {
  try { await ensureXLSX(); } catch (e) { return toast("مكتبة الإكسل ما اتحمّلتش. جرّب تاني."); }
  const wb = XLSX.utils.book_new(), used = new Set();
  for (const g of S.groups) {
    let n = fileSafe(`${g.name} - ${g.source}`).slice(0, 31), k = 2;
    while (used.has(n.toLowerCase())) n = n.slice(0, 28) + " " + k++;
    used.add(n.toLowerCase()); XLSX.utils.book_append_sheet(wb, sheetOf(g), n);
  }
  return saveWb(wb, "كل الأقسام.xlsx");
}

/* ---------- routing & events ---------- */
function route() {
  const g = curGroup(), inD = /^#sheet-/.test(location.hash);
  $("#back").hidden = !inD; $("#fab").hidden = inD || !S.canWrite || !S.db;
  $("#btnAll").hidden = inD || !S.groups.length || !S.dl;
  S.armed = ""; S.dq = ""; S.dstat = "all"; S.limit = 120;
  window.scrollTo(0, 0);
  if (inD) {
    if (g) { $("#ttl").textContent = g.name; renderDetail(g); }
    else { $("#ttl").textContent = BRAND; $("#view").innerHTML = `<div class="empty"><p>${S.ready ? "القسم ده مش موجود." : "بحمّل..."}</p></div>`; }
  } else { $("#ttl").textContent = BRAND; renderHome(); }
}
function refresh() {
  const g = curGroup(), inD = /^#sheet-/.test(location.hash);
  $("#btnAll").hidden = inD || !S.groups.length || !S.dl;
  if (inD) { if (g) { if ($("#rows")) updateDetail(g); else route(); } else route(); } else updateHome();
}
window.addEventListener("hashchange", route);
$("#back").onclick = () => { location.hash = ""; };
$("#fab").onclick = openUpload;
$("#btnAll").onclick = exportAll;
$("#view").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.src != null) { S.src = t.dataset.src; updateHome(); }
  else if (t.dataset.g) { location.hash = "sheet-" + t.dataset.g; }
  else if (t.dataset.st) { S.dstat = t.dataset.st; S.limit = 120; updateDetail(curGroup()); }
  else if (t.dataset.i != null) { openEditor(curGroup(), Number(t.dataset.i)); }
  else if (t.id === "more") { S.limit += 120; updateDetail(curGroup()); }
  else if (t.id === "dl") exportOne(curGroup());
  else if (t.id === "addRow") openEditor(curGroup(), -1);
  else if (t.id === "delG") {
    if (S.armed !== "g") { S.armed = "g"; t.textContent = "اضغط تاني لحذف القسم كله"; t.classList.add("armed"); return; }
    const g = curGroup(); S.armed = ""; t.disabled = true;
    removeGroup(g).then(() => { toast("اتحذف القسم"); location.hash = ""; }).catch(() => { t.disabled = false; toast("ما اتحذفش"); });
  }
});

/* ---------- local storage (IndexedDB) ---------- */
async function LocalDB() {
  const data = { groups: {}, rows: {} }, subs = { groups: [], rows: [] };
  let idb = null;
  try {
    idb = await new Promise((res, rej) => {
      const r = indexedDB.open("masar", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    await new Promise((res, rej) => {
      const c = idb.transaction("kv").objectStore("kv").openCursor();
      c.onsuccess = () => { const k = c.result; if (!k) return res(); const [col, id] = k.key.split("/"); if (data[col]) data[col][id] = k.value; k.continue(); };
      c.onerror = () => rej(c.error);
    });
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) { idb = null; }
  const put = (col, id, v) => idb ? new Promise((res, rej) => { const t = idb.transaction("kv", "readwrite"); v === undefined ? t.objectStore("kv").delete(col + "/" + id) : t.objectStore("kv").put(v, col + "/" + id); t.oncomplete = res; t.onerror = () => rej(t.error); }) : Promise.resolve();
  const snap = col => ({ docs: Object.entries(data[col]).map(([id, v]) => ({ id, data: () => v })) });
  const emit = col => subs[col].forEach(f => f(snap(col)));
  return {
    persistent: !!idb,
    doc(path) {
      const [col, id] = path.split("/");
      return {
        async set(d) { data[col][id] = d; await put(col, id, d); emit(col); },
        async update(d) { data[col][id] = { ...data[col][id], ...d }; await put(col, id, data[col][id]); emit(col); },
        async delete() { delete data[col][id]; await put(col, id, undefined); emit(col); },
      };
    },
    collection(col) { return { onSnapshot(cb) { subs[col].push(cb); cb(snap(col)); return () => {}; } }; },
    dump() { return { groups: data.groups, rows: data.rows }; },
  };
}
function download(filename, data, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function backup() {
  const d = new Date().toISOString().slice(0, 10);
  download(`نسخة مسار ${d}.json`, JSON.stringify(S.db.dump()), "application/json");
  toast("اتنزلت النسخة الاحتياطية");
}
async function restore(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    for (const [id, v] of Object.entries(d.groups || {})) await S.db.doc(`groups/${id}`).set(v);
    for (const [id, v] of Object.entries(d.rows || {})) await S.db.doc(`rows/${id}`).set(v);
    toast("اتسترجعت النسخة");
  } catch (err) { toast("الملف ده مش نسخة صالحة"); }
  e.target.value = "";
}

/* ---------- boot ---------- */
route();
(async () => {
  S.db = await LocalDB();
  S.dl = { save: async ({ filename, data }) => download(filename, data, "application/octet-stream") };
  S.canWrite = true;
  if (!S.db.persistent) toast("المتصفح مانع الحفظ الدائم. الأقسام هتفضل لحد ما تقفل الصفحة.");
  let gOk = false, rOk = false;
  const done = () => { if (gOk && rOk && !S.ready) { S.ready = true; } };
  S.db.collection("groups").onSnapshot(snap => {
    S.groups = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ord || 0) - (b.ord || 0));
    gOk = true; done(); $("#fab").hidden = /^#sheet-/.test(location.hash); refresh();
  });
  S.db.collection("rows").onSnapshot(snap => {
    const c = {};
    for (const d of snap.docs) { const x = d.data(); (c[x.gid] ||= {})[x.i] = x.rows; }
    S.chunks = c; S.cache = {}; rOk = true; done(); refresh();
  });
})();
</script>
